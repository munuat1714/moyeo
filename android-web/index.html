<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3182f6" />
    <title>모행</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; font-family: sans-serif; color: #191f28; background: #f7f8fa; }
      main { padding: 24px; text-align: center; }
      b { display: block; margin-bottom: 8px; font-size: 22px; }
      p { margin: 0; color: #6b7684; line-height: 1.6; }
    </style>
  </head>
  <body><main><b>모행</b><p>앱을 불러오지 못했습니다.<br />인터넷 연결을 확인한 뒤 다시 실행해 주세요.</p></main></body>
</html>
